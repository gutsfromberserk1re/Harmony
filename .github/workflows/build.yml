name: Build Harmony installer

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    tags: ["v*"]            # also builds when you push a tag like v1.0.0

permissions:
  contents: write           # needed to attach the installer to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch yt-dlp.exe
        shell: pwsh
        run: ./scripts/fetch-ytdlp.ps1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        run: cargo tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
