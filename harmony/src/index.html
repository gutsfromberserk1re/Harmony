<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmony</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div id="app-icon" title="Click: toggle playlists  |  Right-click: themes &amp; transparency">
        <img id="icon-img" src="harmony.ico" alt="" draggable="false">
      </div>
      <div class="spacer"></div>
      <div id="title">Harmony</div>
      <div class="spacer"></div>
      <button class="tbtn" id="btn-min" tabindex="-1">–</button>
      <button class="tbtn close" id="btn-close" tabindex="-1">✕</button>
    </header>

    <div id="body">
      <aside id="sidebar">
        <div id="sb-panel">
          <div id="sb-head">
            <span id="sb-title">PLAYLISTS</span>
            <button id="btn-add" tabindex="-1">+</button>
          </div>
          <div id="tree"></div>
        </div>
      </aside>

      <main id="workspace">
        <div id="top">
          <div id="pl-box">
            <div id="pl-label">No Playlist Selected</div>
            <div id="now"></div>
            <div id="list"><div id="list-inner"></div></div>
          </div>
          <canvas id="viz" width="220" height="140"></canvas>
        </div>

        <div id="progress">
          <span id="time-cur">00:00</span>
          <div id="slider">
            <div class="groove"><div class="fill"></div></div>
            <div class="handle"></div>
          </div>
          <span id="time-total">00:00</span>
        </div>

        <div id="bottom">
          <div class="fixed100"></div>
          <div class="spacer"></div>
          <div id="controls">
            <button class="vbtn toggle" id="btn-shuffle" title="Shuffle (S)" tabindex="-1"></button>
            <button class="vbtn" id="btn-prev" tabindex="-1"></button>
            <button class="vbtn" id="btn-play" tabindex="-1"></button>
            <button class="vbtn" id="btn-next" tabindex="-1"></button>
            <button class="vbtn toggle" id="btn-repeat" title="Repeat track (R)" tabindex="-1"></button>
          </div>
          <div class="spacer"></div>
          <div id="volume" title="Scroll wheel (or Up/Down keys) to adjust volume">VOL 80%</div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
